[project]
name = "bitcoin-news-classifier"
version = "0.1.0"
description = "Educational BTC news -> buy/sell/hold baseline (TF-IDF + LogReg, CPU-only)"
requires-python = ">=3.10"
dependencies = ["pandas", "pyarrow", "scikit-learn", "joblib", "requests"]

[project.scripts]
btc-signal = "src.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
